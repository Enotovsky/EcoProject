version: '3.8'

services:
  ecoscan-api:
    build: .
    container_name: ecoscan-api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: python backend.py

  ecoscan-bot:
    build: .
    container_name: ecoscan-bot
    restart: always
    env_file:
      - .env
    command: python tg_bot.py
