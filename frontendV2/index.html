
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>сайт финал</title>
      <meta name="description" content="This web application allows users to easily customize and position logos on their designs, enhancing branding and visual appeal for businesses." />
      <meta name="robots" content="noindex, nofollow" />
      <style>
        html, body { height: 100%; margin: 0; background-color: #0b1120; } /* Темный фон, как в проекте */
        #root { height: 100%; display: flex; flex-direction: column; }
        
        /* Стили для прелоадера */
        .preloader {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          width: 100vw;
          font-family: 'Inter', sans-serif;
          color: #a3e635; /* Зеленый цвет EcoScan */
        }
        
        .spinner {
          width: 50px;
          height: 50px;
          border: 4px solid rgba(163, 230, 53, 0.2);
          border-left-color: #a3e635;
          border-radius: 50%;
          animation: spin 1s linear infinite;
          margin-bottom: 20px;
        }

        .preloader-text {
          font-size: 1.2rem;
          font-weight: 500;
          letter-spacing: 1px;
          animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
          0%, 100% { opacity: 0.6; }
          50% { opacity: 1; }
        }
      </style>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Fira+Mono:wght@400;500;700&family=Fira+Sans+Extra+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:wght@400..700&family=Press+Start+2P&display=swap" rel="stylesheet">
      <link href="https://fonts.cdnfonts.com/css/quinquefive" rel="stylesheet">
    </head>

    <body>
      
      <div id="root">
        <div class="preloader">
          <div class="spinner"></div>
          <div class="preloader-text">EcoScan...</div>
        </div>
      </div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
