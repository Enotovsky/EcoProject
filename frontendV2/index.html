
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>сайт финал</title>
      <meta name="description" content="This web application allows users to easily customize and position logos on their designs, enhancing branding and visual appeal for businesses." />
      <meta name="robots" content="noindex, nofollow" />
      <!-- Ранняя загрузка фона первого экрана, чтобы он появился без задержки -->
      <link rel="preload" as="image" href="/scrapbook/hero_how_bg.webp" type="image/webp" />
      <style>
        /* Фон совпадает с экраном загрузки (Loader.tsx), чтобы не было вспышки до старта React */
        html, body { min-height: 100%; margin: 0; background-color: #F8FFE4; }
        /* min-height (а не height) — иначе #root фиксируется в один экран и внутренний
           div становится прокручиваемым вместо окна, ломая скролл-спай навигации */
        #root { min-height: 100vh; display: flex; flex-direction: column; }
      </style>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Fira+Mono:wght@400;500;700&family=Fira+Sans+Extra+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:wght@400..700&family=Press+Start+2P&display=swap" rel="stylesheet">
      <link href="https://fonts.cdnfonts.com/css/quinquefive" rel="stylesheet">
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
